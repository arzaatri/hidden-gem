<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hidden Gem</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><text y=%2226%22 font-size=%2226%22>💎</text></svg>" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <div class="wordmark">
      <svg class="gem-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M4 9L8 3H16L20 9L12 21L4 9Z" fill="currentColor" />
      </svg>
      <h1>Hidden Gem</h1>
    </div>
    <p class="subtitle">Pick up to 5 games you like, then mine for niche recommendations.</p>
  </header>

  <main>
    <section class="how-it-works">
      <div class="step">
        <span class="step-icon">🎮</span>
        <span>Pick games you love</span>
      </div>
      <div class="step-arrow">→</div>
      <div class="step">
        <span class="step-icon">🔎</span>
        <span>We compare tags + deep-learned embeddings</span>
      </div>
      <div class="step-arrow">→</div>
      <div class="step">
        <span class="step-icon">💎</span>
        <span>Get niche hidden gems</span>
      </div>
    </section>

    <div class="search-box">
      <input id="search-input" type="text" placeholder="Search for a game..." autocomplete="off" />
      <ul id="suggestions" class="suggestions hidden"></ul>
    </div>

    <ul id="selected-games" class="chip-list"></ul>

    <label class="toggle">
      <input id="hidden-gems-only" type="checkbox" checked />
      Hidden gems only
    </label>

    <button id="mine-button" disabled>Mine for gems</button>

    <section id="results"></section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
