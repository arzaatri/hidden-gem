# Non-secret, tunable configuration. Secrets (credentials) live in .env instead.

etl:
  # Cap on games pulled per run. Keep small for local dev/testing; raise for a real run.
  max_games: 1000
  # A game is flagged as a "hidden gem" in the gold layer based on a blended
  # obscurity score over 3 signals: aggregated_rating_count, follows, hypes.
  # For each signal, a game is "obscure" if it's in the bottom N% of that
  # signal *among games released in the same year* (not the whole dataset —
  # otherwise older games look artificially "hidden" just because the
  # industry's audience was smaller back then). Recomputed from the full
  # dataset on every gold rebuild, so cutoffs track the dataset as it grows.
  hidden_gem:
    # Per-signal percentile cutoffs — independently tunable.
    thresholds:
      aggregated_rating_count_percentile: 10
      follows_percentile: 15
      hypes_percentile: 20
    # How much each signal's obscurity flag contributes to the blended
    # score below — must sum to 1.
    weights:
      aggregated_rating_count: 0.5
      follows: 0.3
      hypes: 0.2
    # A game is a hidden gem if its weighted obscurity score (the weighted
    # sum of the 3 obscurity flags above) clears this cutoff — 0.5 means a
    # weighted majority of the configured signals must call it obscure.
    obscurity_score_cutoff: 0.5
  # Daily refresh schedule (cron), used by the Dagster schedule.
  schedule_cron: "0 6 * * *"

recommendation:
  # Number of hidden gems GemFinder returns per request.
  hidden_gem_count: 6
  # Max games a user can select as input to "Mine for gems".
  max_selected_games: 5
  # Hard quality filter on aggregated_rating (critic score). Games below this
  # are never recommended; null ratings pass (no critic reviews isn't the
  # same as being panned).
  rating_cutoff: 65
  # Flat weights for ContentBasedGemFinder's 7 similarity signals — must sum
  # to 1. Missing signals (e.g. no storyline) renormalize across whatever's
  # available for that pair, rather than scoring the missing one as 0.
  weights:
    genre: 0.10
    theme: 0.15
    keyword: 0.25
    summary: 0.20
    storyline: 0.10
    cover: 0.10
    screenshots: 0.10

minio:
  endpoint: "minio:9000" # host:port, no scheme — resolved inside the docker network
  bucket: "hidden-game"
  bronze_prefix: "bronze"
  silver_prefix: "silver"
  use_ssl: false

postgres:
  host: "postgres"
  port: 5432
  gold_schema: "gold"
  etl_state_schema: "etl_state"
  dagster_schema: "dagster"

igdb:
  api_base_url: "https://api.igdb.com/v4"
  auth_url: "https://id.twitch.tv/oauth2/token"
  # Field list requested from the /games endpoint (Apicalypse).
  fields:
    - name
    - rating
    - aggregated_rating
    - aggregated_rating_count
    - follows
    - hypes
    - genres.name
    - themes.name
    - keywords.name
    - summary
    - storyline
    - screenshots.url
    - cover.image_id
    - first_release_date
    - updated_at
  page_size: 500 # IGDB max per request
  requests_per_second: 4 # IGDB rate limit
